# Home Assistant add-on manifest for the Cooper Guardian agent.
# The supervisor injects SUPERVISOR_TOKEN and writes the options below to /data/options.json.
# The same image also runs as a plain Docker container (use HA_URL + HA_TOKEN env instead).
name: Cooper Guardian
version: "0.11.3"
slug: cooper_guardian
description: Goal-driven Claude home agent — watches and acts on your home with judgment.
url: https://github.com/kunalkhosla/cooper
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true   # allows http://supervisor/core/api with SUPERVISOR_TOKEN
hassio_api: true
auth_api: true
ports:
  "8099/tcp": 8099          # /healthz + local control endpoint
options:
  anthropic_api_key: ""
  model: "claude-sonnet-4-5"
  observe_mode: true         # log intended actions, take none, until trusted
  heartbeat_seconds: 600
  max_llm_calls_per_hour: 30 # cost cap: pause automatic camera/watch evals past this
  max_llm_calls_per_day: 250 # cost cap: hard daily ceiling on automatic evals
  briefing_time: ""          # local HH:MM for a daily morning briefing (e.g. "07:00"); "" = off
  notify_targets: []
schema:
  anthropic_api_key: password
  model: str
  observe_mode: bool
  heartbeat_seconds: int
  max_llm_calls_per_hour: int
  max_llm_calls_per_day: int
  briefing_time: str
  notify_targets:
    - str?
